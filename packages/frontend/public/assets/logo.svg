<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>NexoTV</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2450"/>
      <stop offset="1" stop-color="#16122b"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <clipPath id="mark">
      <rect x="120" y="104" width="272" height="272" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <!-- colour bars along the bottom edge -->
    <g transform="translate(0 452)">
      <rect x="0" width="74" height="60" fill="#e9e6f5"/>
      <rect x="73" width="74" height="60" fill="#ffd23f"/>
      <rect x="146" width="74" height="60" fill="#3fd0c9"/>
      <rect x="219" width="74" height="60" fill="#5fd068"/>
      <rect x="292" width="74" height="60" fill="#c566e0"/>
      <rect x="365" width="74" height="60" fill="#ff5b4f"/>
      <rect x="438" width="74" height="60" fill="#4d6bff"/>
    </g>
  </g>
  <!-- N: signal-amber diagonal under two uprights -->
  <polygon points="120,104 188,104 392,376 324,376" fill="#ffb547" clip-path="url(#mark)"/>
  <rect x="120" y="104" width="68" height="272" rx="18" fill="#f1eefa"/>
  <rect x="324" y="104" width="68" height="272" rx="18" fill="#f1eefa"/>
  <!-- tally light -->
  <circle cx="436" cy="76" r="24" fill="#ff5b4f"/>
</svg>
